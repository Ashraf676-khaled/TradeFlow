name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - devolop
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradeFlow.slnx

      - name: Test
        run: dotnet test TradeFlow.slnx --configuration Release --no-restore
        env:
          Jwt__Secret: ${{ secrets.JWT_SECRET }}
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=TradeFlow_Test;User Id=sa;Password=YourStrongPassword123!;Encrypt=True;TrustServerCertificate=True;"