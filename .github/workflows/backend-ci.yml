name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
      - devolop
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test and deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradeFlow.slnx

      - name: Test
        run: dotnet test TradeFlow.slnx --configuration Release --no-restore

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/TradeFlow.Api/TradeFlow.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Take app offline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: take-app-offline
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "The application is being updated. Please wait." > app_offline.htm
          curl --fail --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file app_offline.htm \
            "ftp://${FTP_SERVER}/wwwroot/app_offline.htm"
          echo "Waiting for IIS to release file locks..."
          sleep 10

      - name: Sync published API to hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: ./wwwroot/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app_offline.htm

      - name: Bring app back online
        if: ${{ always() && steps.take-app-offline.outcome != 'skipped' }}
        id: bring-app-online
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "-DELE app_offline.htm" \
            "ftp://${FTP_SERVER}/wwwroot/"
