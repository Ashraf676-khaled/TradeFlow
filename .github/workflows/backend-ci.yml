name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - devolop
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradeFlow.slnx

      - name: Test
        run: dotnet test TradeFlow.slnx --configuration Release --no-restore
        env:
          Jwt__Secret: ${{ secrets.JWT_SECRET }}
